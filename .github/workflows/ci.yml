# CI — typecheck, test, and build both workspaces (app/ scale house,
# office/ main-office portal). npm workspaces at the repo root.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app + office)
        run: npm run check

      - name: Test (app + office)
        run: npm test

      - name: Build (app + office)
        run: npm run build:app && npm run build:office
